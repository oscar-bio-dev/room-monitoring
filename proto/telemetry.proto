syntax = "proto3";

// Mensaje de telemetría del nodo ambiental
message EnvironmentalData {
    // Timestamp (POSIX epoch, segundos)
    uint32 timestamp = 1;

    // BME688
    float temperature = 2;
    float humidity = 3;
    float iaq = 4;
    uint32 iaq_accuracy = 5;

    // SCD41
    uint32 co2_ppm = 6;

    // BMV080
    float pm1_0 = 7;
    float pm2_5 = 8;
    float pm10_0 = 9;

    // Diagnóstico
    uint32 battery_mv = 10;
    uint32 sleep_cycles = 11;
}
