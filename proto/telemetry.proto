syntax = "proto3";

package telemetry;

// Subconjunto estricto del TelemetryPayload canónico del Gateway.
// Los field numbers son SAGRADOS y MUST coincidir con el Mega-Esquema.
// Los campos de identidad (3-5) y de ingestión (8) son inyectados por el Gateway.
message TelemetryPayload {
    // Versioning (el nodo los fija, el Gateway los valida)
    optional uint32 protocol_version = 1;
    optional uint32 schema_version = 2;

    // Identidad: OMITIDOS (inyectados por el Gateway C6)
    // string event_id = 3;
    // string gateway_id = 4;
    // string device_id = 5;

    // Secuencia del nodo (para detección de huecos)
    optional uint32 node_sequence = 6;

    // Tiempo de medición (ms desde epoch, rellenado por el nodo vía RTC)
    optional uint64 measured_at_ms = 7;

    // Ingestión: OMITIDO (inyectado por el Gateway P4)
    // uint64 ingested_at_ms = 8;

    // === Ambiental y Calidad de Aire (BME688 / BSEC / SCD41) ===
    optional float temperature = 9;       // Celsius (compensada por BSEC)
    optional float humidity = 10;         // % RH (compensada por BSEC)
    optional float pressure = 11;         // hPa (presión barométrica)
    optional float gas_resistance = 12;   // Ohms (resistencia del MOX)
    optional float iaq = 13;              // Index of Air Quality (0-500)
    optional uint32 co2 = 14;             // ppm (SCD41 NDIR)

    // === VOCs y CO2 Equivalente (BME688 / BSEC Virtual Sensors) ===
    optional float eco2 = 23;             // ppm (CO2 equivalente derivado de VOCs, BSEC)
    optional float bvoc = 24;             // ppm (Breath VOC equivalente, BSEC)
    optional float tvoc = 25;             // ppb (Total VOC equivalente, BSEC)

    // === Partículas (BMV080 Láser) — Concentración de Masa ===
    optional float pm1_0 = 15;            // ug/m3
    optional float pm2_5 = 16;            // ug/m3
    optional float pm10_0 = 17;           // ug/m3

    // === Partículas (BMV080 Láser) — Concentración Numérica ===
    optional float pm1_0_count = 26;      // particles/m3
    optional float pm2_5_count = 27;      // particles/m3
    optional float pm10_0_count = 28;     // particles/m3

    // === Estado de Hardware del Sensor Láser ===
    optional bool is_laser_obstructed = 29;   // true = lente sucia/bloqueada
    optional bool is_pm_out_of_range = 30;    // true = PM2.5 > 1000 ug/m3
    optional float laser_runtime = 31;        // seconds since measurement start

    // === Agua y Suelo (futuro) ===
    // optional float ph = 18;
    // optional float dissolved_oxygen = 19;

    // === Diagnósticos del Nodo ===
    optional uint32 battery_mv = 20;      // Millivolts (ADC, futuro)
    optional uint32 sleep_cycles = 21;    // Hardware wake count
    optional bool is_calibrating = 22;    // true = datos parciales (BSEC anchor point o warmup)

    // Status report pasivo
    optional uint32 system_error_bitmask = 32;
    optional NodeStatus status = 33;
}

// Estados del Nodo
enum NodeStatus {
    MONITORING = 0;
    CALIBRATING = 1;
    SELF_TESTING = 2;
    HARDWARE_ERROR = 3;
}

// Comandos desde Gateway hacia Nodo
enum Command {
    CMD_NONE = 0;
    CMD_RUN_SELF_TEST = 1;
    CMD_REBOOT = 2;
}

// Respuesta del Gateway (ACK Payload)
message GatewayAck {
    optional Command command = 1;
}

// Reporte de Hardware Self-Test (Activo)
message DiagnosticReport {
    optional uint32 system_error_bitmask = 1;
    optional bool scd41_passed = 2;
    optional bool bmv080_passed = 3;
    optional bool bme688_passed = 4;
}
